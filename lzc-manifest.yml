application:
  subdomain: minifeed
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://minifeed:3000/
services:
  minifeed:
    # upstream: benoitmc/minifeed:20261120151613
    image: registry.lazycat.cloud/czyt/benoitmc/minifeed:661379ca5ac6ab5f
    environment:
      - POSTGRESQL_HOST=minifeed-pg
      - POSTGRESQL_USER=postgres
      - SECRET_KEY_BASE={{ stable_secret "minifeed_secret_key_base" }}
    depends_on:
      - minifeed-pg
  minifeed-pg:
    # upstream: library/postgres:17.12-alpine
    image: registry.lazycat.cloud/czyt/library/postgres:324ee79228b158c1
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    binds:
      - /lzcapp/var/data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      start_period: 90s
